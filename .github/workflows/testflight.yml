name: Build Mink Battery Health iOS
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  testflight:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: "3.3", bundler-cache: true}
      - run: npm install
      - name: Generate iOS project
        run: |
          npx cap add ios
          sed -i '' 's/^use_frameworks!$/use_frameworks! :linkage => :static/' ios/App/Podfile
          cd ios/App
          pod deintegrate
          pod install
      - name: Apply Apple bundle identifier
        run: |
          sed -i '' 's/com\.mink\.batteryhealth/com.9CGZ7BWVXT.minkbatteryhealth/g' ios/App/App.xcodeproj/project.pbxproj
      - name: App Store Connect key
        run: echo '${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}' | base64 --decode > api_key.p8
      - name: Authorize signing repository
        run: |
          AUTH=$(printf 'x-access-token:%s' '${{ secrets.GITHUB_TOKEN }}' | base64 | tr -d '\n')
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"
      - name: Build and upload
        env:
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          TEAMID: ${{ secrets.TEAMID }}
          MATCH_GIT_URL: https://github.com/${{ github.repository }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios beta
